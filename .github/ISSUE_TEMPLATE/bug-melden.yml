name: "Bug melden - 41 Lokeren"
description: "Meld een fout op de website of in de administratie."
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Bedankt om de website van 41 Lokeren te testen!

        Bekijk eerst [de bestaande meldingen](https://github.com/pecharko/Veiling/issues?q=is%3Aissue+is%3Aopen+%22%5BBug%5D%22) om dubbels te vermijden.

        **Let op:** deze melding en eventuele screenshots zijn openbaar.
        Vermeld geen wachtwoorden, e-mailadressen, uitnodigingslinks, tokens,
        persoonlijke gegevens of andere vertrouwelijke informatie.
  - type: dropdown
    id: onderdeel
    attributes:
      label: Waar doet het probleem zich voor?
      options:
        - Publieke website (computer)
        - Publieke website (mobiel)
        - Administratie
        - Anders of niet zeker
    validations:
      required: true
  - type: textarea
    id: probleem
    attributes:
      label: Wat gaat er mis?
      description: Beschrijf wat je ziet, zo concreet mogelijk.
      placeholder: "Bij het openen van een kavel verschijnt de eerste foto niet."
    validations:
      required: true
  - type: textarea
    id: stappen
    attributes:
      label: Hoe kunnen we het probleem herhalen?
      description: Schrijf de stappen op die je hebt gevolgd.
      placeholder: |
        1. Open de website.
        2. Klik op een kavel.
        3. Probeer de foto te openen.
    validations:
      required: true
  - type: textarea
    id: verwacht
    attributes:
      label: Wat had er moeten gebeuren?
      placeholder: "De foto wordt groot getoond."
    validations:
      required: false
  - type: dropdown
    id: ernst
    attributes:
      label: Hoe ernstig is het probleem?
      description: Jouw inschatting; de beheerder bepaalt de uiteindelijke prioriteit.
      options:
        - Blokkerend - ik kan niet verder
        - Hinderlijk - iets werkt niet goed
        - Klein - opmaak of tekst
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Welke browser gebruik je?
      options:
        - Chrome
        - Safari
        - Firefox
        - Edge
        - Andere of onbekend
    validations:
      required: false
  - type: dropdown
    id: toestel
    attributes:
      label: Welk toestel gebruik je?
      options:
        - Computer of laptop
        - iPhone
        - Android-telefoon
        - iPad of andere tablet
        - Ander of onbekend
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot of extra uitleg (optioneel)
      description: Je kunt hier een screenshot toevoegen. Verberg eerst alle privégegevens en toegangscodes.
      placeholder: "Sleep een screenshot in dit vak of geef extra informatie."
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Controle vóór het verzenden
      options:
        - label: "Ik heb geen wachtwoorden, tokens, uitnodigingslinks of persoonsgegevens toegevoegd."
          required: true
