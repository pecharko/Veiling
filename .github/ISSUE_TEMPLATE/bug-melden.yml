name: "Bug of verbetering melden - 41 Lokeren"
description: "Meld een fout of stel een verbetering voor."
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Bedankt om de website van 41 Lokeren te testen!

        Bekijk eerst [de bestaande meldingen](https://github.com/pecharko/Veiling/issues) om dubbels te vermijden.

        **Let op:** deze melding en eventuele screenshots zijn openbaar.
        Vermeld geen wachtwoorden, e-mailadressen, uitnodigingslinks, tokens,
        persoonlijke gegevens of andere vertrouwelijke informatie.
  - type: dropdown
    id: soort
    attributes:
      label: Wat wil je melden?
      description: Kies of het om een fout of om een suggestie gaat.
      options:
        - Bug - iets werkt niet zoals verwacht
        - Verbeteringsvoorstel - iets kan gebruiksvriendelijker of beter
    validations:
      required: true
  - type: dropdown
    id: onderdeel
    attributes:
      label: Op welk onderdeel heeft je melding betrekking?
      options:
        - Publieke website (computer)
        - Publieke website (mobiel)
        - Administratie
        - Anders of niet zeker
    validations:
      required: true
  - type: textarea
    id: probleem
    attributes:
      label: Wat wil je melden of verbeteren?
      description: Beschrijf de fout of je verbeteringsidee zo concreet mogelijk.
      placeholder: "De eerste kavel-foto verschijnt niet, of: ik wil kavels kunnen sorteren op categorie."
    validations:
      required: true
  - type: textarea
    id: stappen
    attributes:
      label: Welke stappen of situatie zijn relevant?
      description: Bij een bug vermeld je de stappen om de fout te herhalen. Bij een verbetering beschrijf je waar je het idee zou gebruiken.
      placeholder: |
        1. Open de website.
        2. Klik op een kavel.
        3. Probeer de foto te openen.
    validations:
      required: true
  - type: textarea
    id: verwacht
    attributes:
      label: Wat verwacht je of wat zou de verbetering opleveren?
      placeholder: "De foto opent groot, of: sorteren helpt mij sneller het juiste kavel vinden."
    validations:
      required: false
  - type: dropdown
    id: ernst
    attributes:
      label: Welke prioriteit zou je geven?
      description: Je eigen inschatting, ook voor verbeteringen; de beheerder bepaalt de planning.
      options:
        - Hoog - belangrijk om snel aan te pakken
        - Normaal - nuttig om op te lossen of te verbeteren
        - Laag - kleine correctie of wens
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot of extra uitleg (optioneel)
      description: Je kunt hier een screenshot toevoegen. Verberg eerst alle privégegevens en toegangscodes.
      placeholder: "Sleep een screenshot in dit vak of geef extra informatie."
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Controle vóór het verzenden
      options:
        - label: "Ik heb geen wachtwoorden, tokens, uitnodigingslinks of persoonsgegevens toegevoegd."
          required: true
