name: B4 independent OVH verification (opt-in)
# SECURITY CHANGE: dispatch job accesses existing write-capable SFTP credentials.
# Do not merge/activate without separate explicit approval.
on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
      release_sha:
        required: true
        type: string
      release_run_id:
        required: true
        type: string
      confirmation:
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/b4-ovh-verification.yml'
      - 'scripts/controller_b4_ovh_readback.py'
      - 'tests/controller_b4_ovh_readback_test.py'
      - 'tests/b4_ovh_workflow_inactive_test.py'
permissions:
  contents: read
  actions: read
jobs:
  validate-inactive-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate B4 workflow is still inactive
        run: python3 -m unittest discover -s tests -p b4_ovh_workflow_inactive_test.py -v
      - name: Test existing B4 offline OVH verification
        run: python3 -m unittest discover -s tests -p controller_b4_ovh_readback_test.py -v
      - name: Lint B4 workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/b4-ovh-verification.yml

  readback:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate immutable run and confirmation before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_ID" =~ ^[a-z0-9][a-z0-9-]{2,60}$ ]]
          test "$CONFIRMATION" = "VERIFY-$RELEASE_ID-$RELEASE_SHA-$RELEASE_RUN_ID"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate release run before executing pinned release code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -c 'import os,sys; sys.path.insert(0,"scripts"); from controller_b4_ovh_readback import verify_release_run; verify_release_run(int(os.environ["RELEASE_RUN_ID"]),os.environ["RELEASE_SHA"],os.environ["GITHUB_TOKEN"])'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          path: release-data
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact release checkout before network access
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C release-data rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git -C release-data status --porcelain --untracked-files=all)"
          # Allow only the expected nested checkout; reject other dirty/untracked files.
          test -z "$(git status --porcelain --untracked-files=normal | grep -v '^?? release-data/$' || true)"
      - name: Pinned readback SFTP dependency
        run: python3 -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Observe OVH file hashes without writes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
          OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
        run: |
          set -euo pipefail
          python3 scripts/controller_b4_ovh_readback.py \
            --release-id "$RELEASE_ID" \
            --release-sha "$RELEASE_SHA" \
            --run-id "$RELEASE_RUN_ID" \
            --release-checkout release-data
