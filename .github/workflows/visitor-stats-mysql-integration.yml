name: Visitor stats isolated MySQL integration
on:
  pull_request:
    paths:
      - "private/visitor_stats_archive.php"
      - "private/visitor_stats.php"
      - "private/visitor_stats_archive_one_day_experimental.php"
      - "private/snapshots.php"
      - "private/restore_diagnosis.php"
      - "private/restore_mixed_diagnosis.php"
      - "catalogus-public/admin/statistieken.php"
      - "dependencies/geoip/composer.json"
      - "dependencies/geoip/composer.lock"
      - "private/visitor_geo_*.php"
      - "tests/visitor_geo_*.php"
      - "database/migrations/20261029_visitor_geo_analytics.sql"
      - "catalogus-public/privacy.php"
      - "database/visitor_stats_aggregates.sql"
      - "tests/visitor_stats_mysql_integration.php"
      - "tests/visitor_stats_tracking_mysql_integration.php"
      - "tests/public_privacy_notice_test.py"
      - "scripts/plan_visitor_stats_six_release.py"
      - ".github/workflows/visitor-stats-mysql-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql-integration:
    name: Isolated MySQL archival tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-test-only-root
          MYSQL_DATABASE: visitor_stats_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: local-test-only-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -plocal-test-only-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, pdo_sqlite, mbstring
          coverage: none
      - name: Install locked official GeoIP2 reader without plugins or scripts
        working-directory: dependencies/geoip
        run: |
          composer validate --no-check-publish --no-check-all
          composer install --no-interaction --no-plugins --no-scripts --prefer-dist
      - name: PHP syntax and isolated database integration
        env:
          ANALYTICS_TEST_DSN: "mysql:host=127.0.0.1;port=3306;dbname=visitor_stats_ci;charset=utf8mb4"
          ANALYTICS_TEST_USER: ci
          ANALYTICS_TEST_PASSWORD: local-test-only-ci
        run: |
          php -l private/visitor_stats_archive.php
          php -l tests/visitor_stats_mysql_integration.php
          php -l catalogus-public/privacy.php
          php tests/visitor_stats_mysql_integration.php
          python3 tests/public_privacy_notice_test.py
          php -l private/visitor_stats.php
          php -l tests/visitor_stats_tracking_mysql_integration.php
          php tests/visitor_stats_tracking_mysql_integration.php
          for test in tests/visitor_geo_*test.php; do php "$test"; done
          php tests/visitor_geo_mysql_integration.php
          php tests/visitor_geo_lifecycle_mysql_integration.php
          python3 tests/visitor_stats_retention_test.py
          python3 tests/visitor_stats_admin_deletion_test.py
