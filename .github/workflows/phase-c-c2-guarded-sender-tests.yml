name: Phase C2 guarded sender offline
on:
  pull_request:
    paths:
      - 'scripts/phase_c_c2_guarded_atomic_sender.py'
      - 'tests/phase_c_c2_guarded_atomic_sender_test.py'
      - '.github/workflows/phase-c-c2-guarded-sender-tests.yml'
permissions:
  contents: read
jobs:
  offline-sender:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p phase_c_c2_guarded_atomic_sender_test.py -v
