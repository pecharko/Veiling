name: Phase C2 transport boundary offline
on:
  pull_request:
    paths:
      - 'scripts/phase_c_c2_transport_boundary.py'
      - 'tests/phase_c_c2_transport_boundary_test.py'
      - '.github/workflows/phase-c-c2-transport-boundary.yml'
permissions:
  contents: read
jobs:
  transport-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p phase_c_c2_transport_boundary_test.py -v
