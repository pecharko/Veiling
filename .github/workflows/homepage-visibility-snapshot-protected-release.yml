name: Homepage section visibility protected snapshot release

on:
  pull_request:
    paths:
      - '.github/workflows/homepage-visibility-snapshot-protected-release.yml'
      - 'scripts/deploy_homepage_visibility_snapshot.py'
      - 'tests/deploy_homepage_visibility_snapshot_test.py'
      - 'releases/homepage-sectie-zichtbaarheid-snapshot-20261122.json'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'HOMEPAGE-SNAPSHOT-DEPLOY-homepage-sectie-zichtbaarheid-snapshot-20261122-<main SHA>'
        required: true
        type: string
      backup_ready:
        description: 'HOMEPAGE-SNAPSHOT-FULL-DB-PHOTOS-BACKUP-20261122 after independent verification'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'ovh-production-deploy' || format('homepage-snapshot-review-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the one-file manifest and offline authorization contracts
        run: |
          set -eu
          python3 -B -m unittest discover -s tests -p deploy_homepage_visibility_snapshot_test.py -v
          python3 -B -m scripts.deploy_homepage_visibility_snapshot plan
          php -l private/snapshots.php
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/homepage-visibility-snapshot-protected-release.yml

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm immutable current main and validate offline
        shell: bash
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          HOMEPAGE_SNAPSHOT_BACKUP_READY: ${{ inputs.backup_ready }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python3 -B -c 'import os; from scripts.deploy_homepage_visibility_snapshot import authorize_dispatch; authorize_dispatch(os.environ)'
          python3 -B -m unittest discover -s tests -p deploy_homepage_visibility_snapshot_test.py -v
          python3 -B -m scripts.deploy_homepage_visibility_snapshot plan
          php -l private/snapshots.php
      - name: Install pinned SFTP client
        run: python3 -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Check drift, back up, upload and verify only private/snapshots.php
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          HOMEPAGE_SNAPSHOT_BACKUP_READY: ${{ inputs.backup_ready }}
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
          OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
        run: python3 -B -m scripts.deploy_homepage_visibility_snapshot deploy
      - name: Retain readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-snapshot-evidence-${{ github.run_id }}
          path: deployment-evidence.json
          retention-days: 7
          if-no-files-found: warn
      - name: Retain protected code backup for rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-snapshot-rollback-${{ github.run_id }}
          path: deployment-backups/
          retention-days: 7
          if-no-files-found: warn
