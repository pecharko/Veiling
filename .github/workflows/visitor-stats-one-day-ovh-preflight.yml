name: Visitor stats one-day OVH read-only preflight

on:
  pull_request:
    paths:
      - 'scripts/preflight_visitor_stats_one_day_ovh.py'
      - '.github/workflows/visitor-stats-one-day-ovh-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile preflight without OVH access
        run: python3 -m py_compile scripts/preflight_visitor_stats_one_day_ovh.py
      - name: Assert code has no remote mutation calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/preflight_visitor_stats_one_day_ovh.py').read_text()
          forbidden = ('sftp.put(', 'sftp.remove(', 'sftp.rename(', 'sftp.mkdir(', 'sftp.rmdir(', 'sftp.chmod(', 'sftp.chown(', 'sftp.symlink(', 'sftp.open(path, "wb")', 'sftp.open(path, "w")')
          assert not any(item in source for item in forbidden), 'Remote mutation pattern found'
          assert 'sftp.lstat(' in source and 'OVH_STATS_ADMIN_BASELINE_SHA256' in source
          print('Offline read-only safety checks passed')
          PY

  read-only-ovh:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline-check
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ovh-production-deploy
      cancel-in-progress: false
    env:
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
      OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
      OVH_STATS_ADMIN_BASELINE_SHA256: ${{ vars.OVH_STATS_ADMIN_BASELINE_SHA256 }}
    steps:
      - name: Checkout read-only tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SFTP client
        run: python3 -m pip install 'paramiko==3.5.1'
      - name: Inspect OVH read-only and stop on drift
        run: python3 scripts/preflight_visitor_stats_one_day_ovh.py
