name: B3.2 isolated MySQL 8.4 claim schema tests
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "database/controller_release_claims_migration.sql"
      - "database/controller_release_claim_bindings_proposal.sql"
      - "scripts/ovh_controller_claim_adapter.py"
      - "scripts/ovh_controller_audit.py"
      - "tests/ovh_controller_audit_test.py"
      - "docs/ovh-controller-independent-audit.md"
      - "deploy/controller/audit-main-ruleset.proposal.json"
      - "deploy/controller/audit-claims.bootstrap.json"
      - "scripts/ovh_controller_claim_store.php"
      - "scripts/ovh_controller_claim_ssh.py"
      - "scripts/ovh_controller_claim_executor.php"
      - "tests/ovh_controller_claim_ssh_test.py"
      - "tests/ovh_controller_claim_stdio_test.php"
      - "docs/ovh-controller-private-ssh.md"
      - "scripts/owner_bound_dispatch.py"
      - "scripts/owner_bound_dispatch_ledger.py"
      - "scripts/shared_ovh_controller_adapter.py"
      - "scripts/shared_ovh_controller_evidence.py"
      - "scripts/controller_cron_handoff_contract.py"
      - "tests/owner_bound_dispatch_integration_test.py"
      - "tests/shared_ovh_controller_evidence_test.py"
      - "tests/shared_ovh_controller_adapter_test.py"
      - "tests/ovh_controller_claim_adapter_test.py"
      - "tests/ovh_controller_claim_protocol_test.php"
      - "tests/ovh_controller_claim_mysql_test.php"
      - "docs/ovh-controller-claim-adapter.md"
      - "tests/controller_mysql_claim_integration.php"
      - ".github/workflows/controller-claims-mysql-integration.yml"
permissions:
  contents: read
jobs:
  claims-mysql-isolated:
    name: Isolated claim schema and uniqueness tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-claims-root
          MYSQL_DATABASE: claim_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: local-claims-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -plocal-claims-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up PHP with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
          coverage: none
      - name: Run isolated claim DDL and duplicate/rollback integration
        env:
          CLAIM_TEST_DSN: "mysql:host=127.0.0.1;port=3306;dbname=claim_ci;charset=utf8mb4"
          CLAIM_TEST_USER: ci
          CLAIM_TEST_PASSWORD: local-claims-ci
        run: |
          php -l tests/controller_mysql_claim_integration.php
          php tests/controller_mysql_claim_integration.php
          php -l scripts/ovh_controller_claim_store.php
          php -l scripts/ovh_controller_claim_executor.php
          php -l tests/ovh_controller_claim_stdio_test.php
          php -l tests/ovh_controller_claim_protocol_test.php
          php -l tests/ovh_controller_claim_mysql_test.php
          php tests/ovh_controller_claim_mysql_test.php
      - name: Require real Python to PHP signed protocol and restore-safety regressions
        env:
          OVH_CLAIM_REQUIRE_PHP: "1"
        run: python3 -B -m unittest discover -s tests -p 'ovh_controller_*test.py' -v
