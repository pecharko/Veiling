name: Read only OVH high resolution photo preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-production-deploy
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
      OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify local PHP source and focused safety test
        run: |
          php -l private/images.php
          php -l catalogus-public/admin/kavel.php
          python3 tests/test_high_resolution_image_safety.py
      - name: Install pinned SFTP client
        run: python3 -m pip install 'paramiko==3.5.1'
      - name: 'Read only: compare two live source files against main'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import posixpath
          import stat
          from pathlib import Path
          from scripts.deploy_ovh_sftp import connect, remote_root
          allowed = ('private/images.php', 'catalogus-public/admin/kavel.php')
          client = connect()
          try:
              with client.open_sftp() as sftp:
                  root = remote_root()
                  for name in allowed:
                      info = sftp.lstat(posixpath.join(root, name))
                      if not stat.S_ISREG(info.st_mode) or info.st_size < 1 or info.st_size > 1048576:
                          raise RuntimeError('STOP: not a regular expected-size file: ' + name)
                      with sftp.open(posixpath.join(root, name), 'rb') as handle:
                          remote = handle.read(1048577)
                      if len(remote) != info.st_size:
                          raise RuntimeError('STOP: changed size during read: ' + name)
                      local = Path(name).read_bytes()
                      print('path:', name)
                      print('remote_bytes:', len(remote))
                      print('remote_sha256:', hashlib.sha256(remote).hexdigest())
                      print('github_sha256:', hashlib.sha256(local).hexdigest())
                      print('identical:', remote == local)
          finally:
              client.close()
          print('No SFTP writes or PHP configuration changes performed.')
          print('PHP runtime memory_limit, post_max_size, upload_max_filesize and GD/WebP support CANNOT be confirmed over SFTP; check via existing authenticated hosting diagnostics.')
          PY
