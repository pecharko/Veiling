name: PHP syntax and repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Lint all versioned PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find catalogus-public private tests -type f -name '*.php' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found"
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Verify CSV import is disabled in source
        run: php tests/csv_import_disabled_test.php

      - name: Check OVH release manifest (offline, no credentials)
        run: |
          python3 -m py_compile scripts/deploy_ovh_sftp.py
          python3 scripts/deploy_ovh_sftp.py plan

      - name: Detect whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD -- catalogus-public private
          else
            git diff --check -- catalogus-public private
          fi
