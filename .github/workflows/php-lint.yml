name: PHP syntax and repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd
          coverage: none
          tools: none

      - name: Lint all versioned PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find catalogus-public private tests -type f -name '*.php' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found"
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Validate generic registered offline release checks
        run: |
          python3 -m py_compile scripts/generic_release_offline_check.py
          python3 scripts/generic_release_offline_check.py

      - name: Validate read-only GitHub release evidence discovery offline
        run: |
          python3 -m py_compile scripts/ovh_release_evidence_discovery.py tests/ovh_release_evidence_discovery_test.py
          python3 -m unittest discover -s tests -p ovh_release_evidence_discovery_test.py -v

      - name: Reconcile independent OVH release evidence offline
        run: |
          python3 -m py_compile scripts/ovh_release_evidence_review.py tests/ovh_release_evidence_review_test.py
          python3 -m unittest discover -s tests -p ovh_release_evidence_review_test.py -v

      - name: Test OVH deployment evidence contract offline
        run: |
          python3 -m py_compile scripts/ovh_deploy_evidence_contract.py tests/ovh_deploy_evidence_contract_test.py
          python3 -m unittest discover -s tests -p ovh_deploy_evidence_contract_test.py -v

      - name: Test inert shared OVH controller adapter without GitHub or OVH access
        run: |
          python3 -m py_compile scripts/shared_ovh_controller_adapter.py tests/shared_ovh_controller_adapter_test.py
          python3 -m unittest discover -s tests -p shared_ovh_controller_adapter_test.py -v

      - name: Test shared OVH GitHub REST evidence retrieval offline without writes
        run: |
          python3 -m py_compile scripts/shared_ovh_controller_evidence.py tests/shared_ovh_controller_evidence_test.py
          python3 -m unittest discover -s tests -p shared_ovh_controller_evidence_test.py -v

      - name: Test inert controller read-only report and adversarial fixtures
        run: |
          python3 -m py_compile scripts/controller_readonly_report.py tests/controller_readonly_report_test.py
          python3 -m unittest discover -s tests -p controller_readonly_report_test.py -v

      - name: Test read-only release artifact and rollback evidence consistency
        run: |
          python3 -m py_compile scripts/controller_artifact_consistency.py tests/controller_artifact_consistency_test.py
          python3 -m unittest discover -s tests -p controller_artifact_consistency_test.py -v

      - name: Validate conservative integration CI impact routing offline
        run: |
          python3 -m py_compile scripts/ci_pr_impact.py tests/ci_pr_impact_test.py
          python3 -m unittest discover -s tests -p ci_pr_impact_test.py -v

      - name: Test deployment controller security guards offline
        run: |
          python3 -m py_compile scripts/verified_deploy_controller.py
          python3 tests/verified_deploy_controller_test.py
          python3 tests/registered_release_contract_test.py
          python3 tests/auction_registered_deploy_test.py
          python3 tests/generic_auto_readonly_contract_test.py
          python3 tests/lot_sale_controller_adapter_test.py
          python3 tests/lot_sale_controller_end_to_end_test.py
          php tests/auction_organisation_test.php
          php tests/admin_session_role_contract_test.php
          php tests/admin_role_menu_contract_test.php
          python3 -m py_compile scripts/controller_readonly_integration.py

      - name: Test JPEG PNG WebP processing in isolation
        run: php -d memory_limit=512M tests/photo_gd_isolated.php

      - name: Test 48 MP JPEG PNG WebP conversion at 512 MB
        run: php -d memory_limit=512M tests/photo_48mp_boundary.php

      - name: Verify CSV import is disabled in source
        run: php tests/csv_import_disabled_test.php

      - name: Check photo-less lot placeholder asset
        run: php tests/site_assets_test.php

      - name: Check OVH release manifest (offline, no credentials)
        run: |
          python3 -m py_compile scripts/deploy_ovh_sftp.py
          python3 scripts/deploy_ovh_sftp.py plan

      - name: Test lot editor form persistence
        run: php tests/lot_form_test.php

      - name: Test independent public website availability switch
        run: php tests/site_online_switch_contract_test.php

      - name: Test sale location and auction number contracts
        run: php tests/lot_sale_location_test.php

      - name: Test isolated catalog reset photo removal and safety contracts
        run: |
          php tests/catalog_reset_contract_test.php
          php tests/catalog_reset_photo_test.php

      - name: Verify editor-only deployment files (offline)
        run: |
          python3 -m py_compile scripts/deploy_kavel_editor.py
          python3 scripts/deploy_kavel_editor.py plan

      - name: Verify T-016/T-017 deployment manifest offline
        run: |
          python3 -m py_compile scripts/deploy_snapshot_storage.py
          python3 scripts/deploy_snapshot_storage.py plan

      - name: Verify photo-import retirement deployment offline
        run: |
          python3 -m py_compile scripts/deploy_photo_import_retirement.py
          python3 scripts/deploy_photo_import_retirement.py plan

      - name: Verify audited six-file release plan offline
        run: |
          python3 -m py_compile scripts/deploy_audit_release.py
          python3 scripts/deploy_audit_release.py plan
          python3 tests/audit_release_plan_test.py

      - name: Verify eight-file recovery release source manifest (offline)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/plan_catalog_recovery_release.py
          python3 scripts/plan_catalog_recovery_release.py \
            --release-sha "$(git rev-parse HEAD)" > /dev/null
          if python3 scripts/plan_catalog_recovery_release.py \
             --release-sha '0000000000000000000000000000000000000000' > /dev/null 2>&1; then
            echo 'Unsafe offline plan accepted a wrong release SHA.'
            exit 1
          fi
          echo 'Offline plan validated; mismatched SHA rejected; no production access.'

      - name: T-060 verify recovery SFTP preflight is read-only using fake server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/preflight_catalog_recovery_remote.py tests/recovery_remote_preflight_test.py
          python3 tests/recovery_remote_preflight_test.py
          echo 'No OVH connection, secrets, SQL or production writes used by T-060.'

      - name: Verify disabled account access safeguards
        run: |
          php -l catalogus-public/admin/gebruikers.php
          php -l catalogus-public/admin/login.php
          php -l private/bootstrap.php
          php tests/user_disable_contract_test.php

      - name: Verify daily visitor archive contract (7-day cutoff, CLI-only, rollback)
        run: python3 tests/visitor_stats_daily_cron_contract_test.py

      - name: Detect whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD -- catalogus-public private
          else
            git diff --check -- catalogus-public private
          fi
