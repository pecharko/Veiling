name: Phase C2 disabled executor boundary
on:
  pull_request:
    paths:
      - 'scripts/phase_c_c2_disabled_executor.py'
      - 'tests/phase_c_c2_disabled_executor_test.py'
      - '.github/workflows/phase-c-c2-disabled-executor-tests.yml'
permissions:
  contents: read
jobs:
  offline-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p phase_c_c2_disabled_executor_test.py -v
