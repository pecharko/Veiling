name: Deploy auditverbeteringen PR25 PR26 PR27 (handmatig)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = offline controle; deploy = zes exact vastgelegde bestanden overzetten'
        required: true
        type: choice
        options:
          - plan
          - deploy
        default: plan
      release_sha:
        description: 'Exacte goedgekeurde main commit SHA; verplicht voor deploy'
        required: false
        type: string
        default: ''
      confirmation:
        description: 'Voor echte upload exact DEPLOY AUDIT RELEASE typen'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ovh-production-deploy
  cancel-in-progress: false

jobs:
  audit-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
      OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect exact release list and Python syntax
        run: |
          python3 -m py_compile scripts/deploy_audit_release.py
          python3 scripts/deploy_audit_release.py plan

      - name: Set up PHP for syntax checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Verify all four runtime PHP files compile
        run: |
          php -l catalogus-public/admin/backup.php
          php -l catalogus-public/admin/kavel.php
          php -l catalogus-public/admin/logout.php
          php -l private/bootstrap.php

      - name: Require explicit approval for production
        if: inputs.mode == 'deploy'
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != 'DEPLOY AUDIT RELEASE' ]; then
            echo 'Not authorized: enter DEPLOY AUDIT RELEASE to upload.'
            exit 1
          fi
          if [ -z "$RELEASE_SHA" ] || [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo 'Approved release SHA differs from checked-out main SHA.'
            exit 1
          fi
          for key in OVH_SFTP_HOST OVH_SFTP_USER OVH_SFTP_PASSWORD OVH_SFTP_KNOWN_HOSTS OVH_SFTP_BASE; do
            if [ -z "${!key:-}" ]; then
              echo "SFTP configuration missing: $key"
              exit 1
            fi
          done

      - name: Install pinned SFTP client
        if: inputs.mode == 'deploy'
        run: python3 -m pip install 'paramiko==3.5.1'

      - name: Verify remote tree and back up existing runtime files
        if: inputs.mode == 'deploy'
        run: python3 scripts/deploy_audit_release.py backup

      - name: Store private recovery artifact BEFORE uploading
        if: inputs.mode == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: ovh-audit-pr25-26-27-before-${{ github.run_id }}
          path: deployment-backups/
          retention-days: 7
          if-no-files-found: error

      - name: Upload six audited paths and read back SHA256, rollback on upload errors
        if: inputs.mode == 'deploy'
        run: python3 scripts/deploy_audit_release.py upload

      - name: Read-only HTTP tests for protected admin and retired imports
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local description="$1" expected="$2" url="$3" method="${4:-GET}"
            local actual
            actual=$(curl --silent --show-error --max-time 20 \
              -o /dev/null -w '%{http_code}' -X "$method" "$url")
            if [ "$actual" != "$expected" ]; then
              echo "$description FAILED: HTTP $actual, expected $expected"
              exit 1
            fi
            echo "$description OK: HTTP $actual"
          }
          check 'Homepage' 200 'https://41lokeren.be/'
          check 'SVG placeholder' 200 'https://41lokeren.be/assets/placeholder.svg'
          check 'Login page' 200 'https://41lokeren.be/admin/login.php'
          check 'Protected backup page' 303 'https://41lokeren.be/admin/backup.php'
          check 'Protected admin dashboard' 303 'https://41lokeren.be/admin/index.php'
          check 'Protected kavel editor' 303 'https://41lokeren.be/admin/kavel.php'
          check 'Logout GET unauthenticated' 303 'https://41lokeren.be/admin/logout.php'
          check 'Protected system check' 303 'https://41lokeren.be/admin/systeemcheck.php'
          check 'Photo bulk disabled GET' 404 'https://41lokeren.be/admin/fotos-bulk.php'
          check 'Photo bulk disabled empty POST' 404 'https://41lokeren.be/admin/fotos-bulk.php' POST
          check 'CSV disabled GET' 404 'https://41lokeren.be/admin/import.php'
          check 'CSV disabled empty POST' 404 'https://41lokeren.be/admin/import.php' POST
