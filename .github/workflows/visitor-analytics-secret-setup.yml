name: Visitor analytics secret setup (manual)

on:
  pull_request:
    paths:
      - 'scripts/configure_visitor_analytics_secret.py'
      - 'tests/visitor_analytics_secret_test.py'
      - '.github/workflows/visitor-analytics-secret-setup.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect is read only; install changes only private/config.php'
        required: true
        type: choice
        options:
          - inspect
          - install
        default: inspect
      release_sha:
        description: 'Exact current main SHA'
        required: true
        type: string
      expected_config_sha:
        description: 'Read-only inspect result SHA256 (required for install)'
        required: false
        type: string
      confirmation:
        description: 'For install type INSTALL ANALYTICS SECRET IN PRIVATE CONFIG'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ovh-production-deploy
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none
      - name: Run isolated secret handling tests
        run: python3 tests/visitor_analytics_secret_test.py

  manual-config-operation:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
      OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
    steps:
      - name: Require pinned SHA and explicit separate authorization
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          EXPECTED_SHA: ${{ inputs.expected_config_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$RELEASE_SHA" == "$GITHUB_SHA" ]] || exit 1
          if [[ "$MODE" == install ]]; then
            [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$CONFIRMATION" == 'INSTALL ANALYTICS SECRET IN PRIVATE CONFIG' ]] || exit 1
          else
            [[ "$MODE" == inspect ]] || exit 1
          fi
          for key in OVH_SFTP_HOST OVH_SFTP_USER OVH_SFTP_PASSWORD OVH_SFTP_KNOWN_HOSTS OVH_SFTP_BASE; do
            [[ -n "${!key:-}" ]] || { echo "Missing required secret or setting"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none
      - name: Validate isolated tests before touching OVH
        run: python3 tests/visitor_analytics_secret_test.py
      - name: Install pinned SFTP client
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'paramiko==3.5.1'
      - name: 'Inspect or install private analytics key via pinned SFTP'
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_SHA: ${{ inputs.expected_config_sha }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$MODE" == inspect ]]; then
            python3 scripts/configure_visitor_analytics_secret.py --mode inspect
          else
            python3 scripts/configure_visitor_analytics_secret.py --mode install --expected-sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID"
          fi
