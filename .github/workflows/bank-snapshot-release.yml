name: Bank-compatible protected catalog snapshot release
on:
  pull_request:
    paths:
      - 'private/snapshots.php'
      - 'scripts/deploy_bank_snapshot.py'
      - 'tests/deploy_bank_snapshot_test.py'
      - 'releases/bank-snapshot-20261110.json'
      - '.github/workflows/bank-snapshot-release.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'BANK-SNAPSHOT-DEPLOY-bank-snapshot-20261110-<exact main SHA>'
        required: true
        type: string
      schema_ready:
        description: 'BANK-SCHEMA-VERIFIED-20261110 after separately authorized DB migration'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'ovh-production-deploy' || format('bank-snapshot-review-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify dedicated bank snapshot release guards offline
        run: |
          python3 -B -m unittest discover -s tests -p deploy_bank_snapshot_test.py -v
          python3 -B -m unittest discover -s tests -p bank_snapshot_workflow_routing_test.py -v
          # Historical manifests are immutable. Validate an exact legacy source
          # with the existing bank gate; separately review v7 without ever
          # changing the historical manifest or its production deploy path.
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys

          source = Path('private/snapshots.php').read_bytes()
          legacy_manifest = Path('releases/bank-snapshot-20261110.json')
          if not legacy_manifest.is_file():
              raise SystemExit('Historical bank snapshot manifest missing')
          legacy = json.loads(legacy_manifest.read_text(encoding='utf-8'))
          entries = legacy.get('files', [])
          if len(entries) != 1 or entries[0].get('path') != 'private/snapshots.php':
              raise SystemExit('Historical bank snapshot manifest invalid')
          expected = entries[0]['source_sha256']
          if hashlib.sha256(source).hexdigest() == expected:
              subprocess.run([sys.executable, '-B', '-m', 'scripts.deploy_bank_snapshot', 'plan'], check=True)
          elif b'41lokeren-v7-lot-audit' in source:
              # The v7 route is review-only. The original bank production
              # dispatch remains guarded by its exact historical source SHA.
              subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s',
                              'tests', '-p', 'deploy_lot_audit_snapshot_v7_test.py', '-v'], check=True)
              v7_manifest = Path('releases/lot-audit-snapshot-v7-20261111.json')
              if v7_manifest.exists():
                  # The historic source/manifest are pinned and must be checked
                  # in their original immutable tree, not current snapshots.php.
                  from tempfile import TemporaryDirectory
                  historic = '3c9b10a80001fe6ad4d59aa776f638b2dbf9ef42'
                  with TemporaryDirectory() as temp:
                      history = Path(temp) / 'historic-v7'
                      subprocess.run(['git','worktree','add','--detach',str(history),historic],check=True)
                      try:
                          subprocess.run([sys.executable, '-B', '-m',
                                          'scripts.deploy_lot_audit_snapshot_v7', 'plan'],
                                         cwd=history,check=True)
                      finally:
                          subprocess.run(['git','worktree','remove','--force',str(history)],check=True)
              else:
                  print('v7 reviewed offline; independent OVH baseline and v7 release manifest still required')
          else:
              raise SystemExit('Unrecognized protected snapshot source drift')
          PY
      - name: Verify shared OVH denylist never changed
        run: |
          python3 - <<'PY'
          from scripts.shared_ovh_release import PROTECTED
          assert 'private/snapshots' in PROTECTED
          PY
      - name: Lint dedicated workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/bank-snapshot-release.yml
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
      BANK_SCHEMA_READY: ${{ inputs.schema_ready }}
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
      OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable main and exact owner/DB confirmation
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$DEPLOY_CONFIRMATION" = "BANK-SNAPSHOT-DEPLOY-bank-snapshot-20261110-$GITHUB_SHA"
          test "$BANK_SCHEMA_READY" = 'BANK-SCHEMA-VERIFIED-20261110'
      - name: Offline source, manifest and PHP lint
        run: |
          python3 -B -m unittest discover -s tests -p deploy_bank_snapshot_test.py -v
          python3 -B -m scripts.deploy_bank_snapshot plan
          php -l private/snapshots.php
      - name: Install pinned SFTP runtime
        run: python3 -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Fresh protected drift, backup, upload, readback and rollback
        run: python3 -B -m scripts.deploy_bank_snapshot deploy
      - name: Retain protected source readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-snapshot-evidence-${{ github.run_id }}
          path: deployment-evidence.json
          retention-days: 7
          if-no-files-found: warn
      - name: Retain protected snapshot rollback backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-snapshot-rollback-${{ github.run_id }}
          path: deployment-backups/
          retention-days: 7
          if-no-files-found: warn
