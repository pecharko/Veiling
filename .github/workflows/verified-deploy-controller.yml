name: Verified deploy authorization controller
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: verified-production-deploy-controller
  cancel-in-progress: false
jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate authorization and dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVAL_TEXT: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/verified_deploy_controller.py
