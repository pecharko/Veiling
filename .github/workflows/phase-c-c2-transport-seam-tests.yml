name: Phase C2 disabled transport seam
on:
  pull_request:
    paths:
      - 'scripts/phase_c_c2_trusted_transport_seam.py'
      - 'tests/phase_c_c2_trusted_transport_seam_test.py'
      - '.github/workflows/phase-c-c2-transport-seam-tests.yml'
permissions:
  contents: read
jobs:
  offline-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p phase_c_c2_trusted_transport_seam_test.py -v
