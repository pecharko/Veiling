name: Phase C2 integrated boundary offline CI
on:
  pull_request:
    paths:
      - 'scripts/phase_c_c2_integrated_boundary.py'
      - 'tests/phase_c_c2_integrated_boundary_test.py'
      - '.github/workflows/phase-c-c2-integrated-boundary-tests.yml'
permissions:
  contents: read
jobs:
  offline-integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p phase_c_c2_integrated_boundary_test.py -v
