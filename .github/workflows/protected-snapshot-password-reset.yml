name: Protected snapshot password reset one-file release
on:
  pull_request:
    paths:
      - '.github/workflows/protected-snapshot-password-reset.yml'
      - 'scripts/deploy_protected_password_reset_snapshot.py'
      - 'tests/protected_password_reset_snapshot_release_test.py'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'PROTECTED-SNAPSHOT-DEPLOY-protected-snapshot-password-reset-20261028-<main SHA>'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ovh-production-deploy
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p protected_password_reset_snapshot_release_test.py
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
      OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Verify exact source and independent authorization
        run: |
          python3 -m unittest discover -s tests -p protected_password_reset_snapshot_release_test.py
          python3 -m scripts.deploy_protected_password_reset_snapshot plan
          test "$DEPLOY_CONFIRMATION" = "PROTECTED-SNAPSHOT-DEPLOY-protected-snapshot-password-reset-20261028-$GITHUB_SHA"
      - name: Install pinned SFTP client
        run: python3 -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Upload only protected snapshot, rollback on failure
        run: python3 -m scripts.deploy_protected_password_reset_snapshot deploy
      - name: Preserve observed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-snapshot-evidence-${{ github.run_id }}
          path: deployment-evidence.json
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve rollback backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-snapshot-rollback-${{ github.run_id }}
          path: deployment-backups/
          retention-days: 7
          if-no-files-found: warn
