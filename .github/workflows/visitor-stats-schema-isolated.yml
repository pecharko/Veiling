name: Visitor stats MySQL schema isolated tests

on:
  pull_request:
    paths:
      - 'database/visitor_stats_install_proposed.sql'
      - 'scripts/test_visitor_stats_schema_contract.py'
      - '.github/workflows/visitor-stats-schema-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-isolated:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_DATABASE: stats_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run static DDL tests
        run: python3 scripts/test_visitor_stats_schema_contract.py
      - name: Recreate observed daily schema in disposable MySQL and install ONLY aggregates
        env:
          MYSQL_PWD: integration-only-password
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot stats_test <<'SQL'
          CREATE TABLE visitor_stats_daily (
            visit_date DATE NOT NULL,
            visitor_id BINARY(32) NOT NULL,
            page_kind VARCHAR(8) NOT NULL,
            lot_id BIGINT UNSIGNED NOT NULL DEFAULT 0,
            views INT UNSIGNED NOT NULL DEFAULT 1,
            PRIMARY KEY (visit_date, visitor_id, page_kind, lot_id),
            KEY idx_lot_top (visit_date, page_kind, lot_id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          INSERT INTO visitor_stats_daily
            (visit_date, visitor_id, page_kind, lot_id, views)
            VALUES ('2026-10-01', UNHEX(REPEAT('ab',32)), 'home', 0, 7);
          SQL
          mysql -h127.0.0.1 -uroot stats_test < database/visitor_stats_install_proposed.sql
          mysql -h127.0.0.1 -uroot -N stats_test -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='stats_test' AND TABLE_NAME IN ('visitor_stats_daily','visitor_stats_day_totals','visitor_stats_lot_totals')" | grep -qx 3
          mysql -h127.0.0.1 -uroot -N stats_test -e "SELECT views FROM visitor_stats_daily WHERE visit_date='2026-10-01'" | grep -qx 7
          mysql -h127.0.0.1 -uroot -N stats_test -e "SELECT DATA_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='stats_test' AND TABLE_NAME='visitor_stats_daily' AND COLUMN_NAME='views'" | grep -qx int
          if mysql -h127.0.0.1 -uroot stats_test < database/visitor_stats_install_proposed.sql; then
            echo "STOP: repeated installation unexpectedly succeeded" >&2
            exit 1
          fi
          mysql -h127.0.0.1 -uroot -N stats_test -e "SELECT views FROM visitor_stats_daily WHERE visit_date='2026-10-01'" | grep -qx 7
