name: Phase C2 authenticated GraphQL readonly transport tests
on:
  pull_request:
    paths:
      - 'scripts/phase_c_c2_graphql_readonly_transport.py'
      - 'tests/phase_c_c2_graphql_readonly_transport_test.py'
      - '.github/workflows/phase-c-c2-graphql-readonly-tests.yml'
permissions:
  contents: read
jobs:
  offline-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p phase_c_c2_graphql_readonly_transport_test.py -v
