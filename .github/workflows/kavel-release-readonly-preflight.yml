name: Kavel release automatische read-only preflight
on:
  workflow_run:
    workflows:
      - PHP syntax and repository checks
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-production-deploy
  cancel-in-progress: false
jobs:
  readonly:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
      OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
    steps:
      - name: Checkout exact merged commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Require exact current main SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" || exit 1
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none
      - name: Validate four-file release offline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy_lot_number_thumbnail.py
          php -l catalogus-public/admin/kavel.php
          php -l private/lot_form.php
          php -l catalogus-public/admin/index.php
          php tests/first_available_lot_number_test.php
          php tests/admin_lot_cover_contract_test.php
          php tests/duplicate_lot_number_suggestion_contract_test.php
          python3 scripts/deploy_lot_number_thumbnail.py plan
      - name: Install pinned read-only SFTP library
        run: python3 -m pip install 'paramiko==3.5.1'
      - name: Inspect production hashes without writing
        env:
          PREFLIGHT_MANIFEST_PATH: preflight-sha256.json
        run: python3 scripts/deploy_lot_number_thumbnail.py preflight
      - name: Store immutable preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: kavel-preflight-sha256-${{ github.run_id }}
          path: preflight-sha256.json
          if-no-files-found: error
          retention-days: 1
