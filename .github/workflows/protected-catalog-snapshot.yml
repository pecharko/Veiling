name: Protected catalog snapshot one-file release
on:
  pull_request:
    paths:
      - '.github/workflows/protected-catalog-snapshot.yml'
      - 'scripts/deploy_protected_catalog_snapshot.py'
      - 'tests/protected_catalog_snapshot_release_test.py'
      - 'scripts/shared_ovh_release.py'
      - 'scripts/ovh_deploy_evidence_contract.py'
      - 'private/snapshots.php'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'PROTECTED-SNAPSHOT-DEPLOY-protected-catalog-snapshot-20261106-<exact current main SHA>'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ovh-production-deploy
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline security regressions and exact source plan
        run: |
          python3 -B -m unittest discover -s tests -p protected_catalog_snapshot_release_test.py -v
          python3 -B -m scripts.deploy_protected_catalog_snapshot plan
      - name: Lint dedicated workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/protected-catalog-snapshot.yml
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
      OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Verify exact source and independent authorization
        run: |
          python3 -B -m unittest discover -s tests -p protected_catalog_snapshot_release_test.py -v
          python3 -B -m scripts.deploy_protected_catalog_snapshot plan
          test "$DEPLOY_CONFIRMATION" = "PROTECTED-SNAPSHOT-DEPLOY-protected-catalog-snapshot-20261106-$GITHUB_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none
      - name: Lint exact PHP target
        run: php -l private/snapshots.php
      - name: Install pinned SFTP client
        run: python3 -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Drift check, backup, one-file upload, readback and rollback
        run: python3 -B -m scripts.deploy_protected_catalog_snapshot deploy
      - name: Preserve observed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-catalog-snapshot-evidence-${{ github.run_id }}
          path: deployment-evidence.json
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve rollback backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-catalog-snapshot-rollback-${{ github.run_id }}
          path: deployment-backups/
          retention-days: 7
          if-no-files-found: warn
