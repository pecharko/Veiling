name: Read-only protected htaccess OVH baseline
on:
  pull_request:
    paths:
      - '.github/workflows/readonly-htaccess-baseline.yml'
      - 'scripts/readonly_htaccess_baseline.py'
      - 'tests/readonly_htaccess_baseline_test.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'ovh-production-deploy' || format('readonly-htaccess-review-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline restricted SFTP regressions
        run: python3 -B -m unittest discover -s tests -p readonly_htaccess_baseline_test.py -v
      - name: Workflow lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/readonly-htaccess-baseline.yml
  observe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
      OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify fixed scope with offline tests
        run: python3 -B -m unittest discover -s tests -p readonly_htaccess_baseline_test.py -v
      - name: Install pinned SFTP runtime
        run: python3 -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Read only exactly public htaccess and emit hash
        run: python3 -B -m scripts.readonly_htaccess_baseline
      - name: Retain hash-only evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: readonly-htaccess-baseline-${{ github.run_id }}
          path: readonly-htaccess-baseline.json
          retention-days: 7
          if-no-files-found: error
