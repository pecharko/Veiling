name: Password reset protected snapshot read-only SHA comparison
on:
  pull_request:
    paths:
      - '.github/workflows/password-reset-snapshot-readonly.yml'
      - 'scripts/readonly_password_reset_snapshot_baseline.py'
      - 'tests/readonly_password_reset_snapshot_baseline_test.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-production-deploy
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p readonly_password_reset_snapshot_baseline_test.py
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
      OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Compare exactly protected snapshot file without writes
        run: python3 -m scripts.readonly_password_reset_snapshot_baseline
