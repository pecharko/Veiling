name: Phase C2 installation proof offline
on:
  pull_request:
    paths:
      - 'scripts/phase_c_c2_installation_proof.py'
      - 'tests/phase_c_c2_installation_proof_test.py'
      - '.github/workflows/phase-c-c2-installation-proof-tests.yml'
permissions:
  contents: read
jobs:
  installation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p phase_c_c2_installation_proof_test.py -v
