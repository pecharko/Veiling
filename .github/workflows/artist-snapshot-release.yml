name: Artist-compatible protected catalog snapshot release
on:
  pull_request:
    paths:
      - 'private/snapshots.php'
      - 'scripts/deploy_artist_snapshot.py'
      - 'tests/deploy_artist_snapshot_test.py'
      - 'releases/artist-snapshot-20261108.json'
      - '.github/workflows/artist-snapshot-release.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'ARTIST-SNAPSHOT-DEPLOY-artist-snapshot-20261108-<exact main SHA>'
        required: true
        type: string
      schema_ready:
        description: 'ARTIST-SCHEMA-VERIFIED-20261108 after separately authorized DB migration'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'ovh-production-deploy' || format('artist-snapshot-review-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated protected release guards offline
        run: |
          python3 -B -m unittest discover -s tests -p deploy_artist_snapshot_test.py -v
          if test -f releases/artist-snapshot-20261108.json; then
            python3 -B -m scripts.deploy_artist_snapshot plan
          else
            echo 'Awaiting authenticated independent read-only OVH baseline and same-PR manifest'
          fi
      - name: Verify four-file artist runtime manifest, immutable scope and source hashes
        run: |
          python3 -B -m scripts.shared_ovh_release plan artist-fields-20261108
          python3 - <<'PY'
          from scripts.shared_ovh_release import load_manifest
          manifest, payload, remotes = load_manifest('artist-fields-20261108')
          assert list(payload) == [
              'catalogus-public/admin/kavel.php',
              'private/lot_artist.php',
              'catalogus-public/index.php',
              'catalogus-public/kavel.php',
          ]
          assert remotes['private/lot_artist.php'] == 'ABSENT'
          assert all('snapshots' not in name for name in payload)
          print('VERIFIED REVIEWED ARTIST RUNTIME MANIFEST')
          PY
      - name: Verify shared OVH denylist never changed
        run: |
          python3 - <<'PY'
          from scripts.shared_ovh_release import PROTECTED
          assert 'private/snapshots' in PROTECTED
          PY
      - name: Lint dedicated workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/artist-snapshot-release.yml
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
      ARTIST_SCHEMA_READY: ${{ inputs.schema_ready }}
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
      OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable main and exact owner/DB confirmation
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$DEPLOY_CONFIRMATION" = "ARTIST-SNAPSHOT-DEPLOY-artist-snapshot-20261108-$GITHUB_SHA"
          test "$ARTIST_SCHEMA_READY" = 'ARTIST-SCHEMA-VERIFIED-20261108'
      - name: Offline source, manifest and PHP lint
        run: |
          python3 -B -m unittest discover -s tests -p deploy_artist_snapshot_test.py -v
          python3 -B -m scripts.deploy_artist_snapshot plan
          php -l private/snapshots.php
      - name: Install pinned SFTP runtime
        run: python3 -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Fresh protected drift, backup, upload, readback and rollback
        run: python3 -B -m scripts.deploy_artist_snapshot deploy
      - name: Retain protected source readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artist-snapshot-evidence-${{ github.run_id }}
          path: deployment-evidence.json
          retention-days: 7
          if-no-files-found: warn
      - name: Retain protected snapshot rollback backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artist-snapshot-rollback-${{ github.run_id }}
          path: deployment-backups/
          retention-days: 7
          if-no-files-found: warn
