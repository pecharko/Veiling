name: Premerge shared OVH manifest offline contract
on:
  pull_request:
    paths:
      - 'scripts/premerge_shared_release_manifest.py'
      - 'tests/premerge_shared_release_manifest_test.py'
      - '.github/workflows/premerge-shared-ovh-contract.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned existing SFTP library dependency for readonly path validator
        run: python3 -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Offline regression tests
        run: python3 -B -m unittest discover -s tests -p premerge_shared_release_manifest_test.py -v
