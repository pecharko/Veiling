name: Phase C app read-only transport offline

on:
  pull_request:
    paths:
      - 'scripts/phase_c_app_readonly_transport.py'
      - 'tests/phase_c_app_readonly_transport_test.py'
      - '.github/workflows/phase-c-app-readonly-transport-tests.yml'

permissions:
  contents: read

jobs:
  readonly-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p phase_c_app_readonly_transport_test.py -v
