name: Phase C2 owner scope contract offline
on:
  pull_request:
    paths:
      - 'scripts/phase_c_c2_owner_gate.py'
      - 'tests/phase_c_c2_owner_gate_test.py'
      - '.github/workflows/phase-c-c2-owner-gate-tests.yml'
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p phase_c_c2_owner_gate_test.py -v
