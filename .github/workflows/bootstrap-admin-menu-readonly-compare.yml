name: Read only compare OVH bootstrap admin menu
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-production-deploy
  cancel-in-progress: false
jobs:
  inspect-bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
      OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
    steps:
      - name: Checkout current GitHub source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source syntax and require menu item
        run: |
          php -l private/bootstrap.php
          grep -Fq "admin/statistieken.php" private/bootstrap.php
      - name: Install pinned read-only SSH client
        run: python3 -m pip install 'paramiko==3.5.1'
      - name: Read-only compare exact bootstrap file
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import posixpath
          import stat
          from pathlib import Path
          from scripts.deploy_ovh_sftp import connect, remote_root
          name='private/bootstrap.php'
          reference=Path(name).read_bytes()
          assert len(reference) < 1000000
          client=connect()
          try:
              with client.open_sftp() as sftp:
                  target=posixpath.join(remote_root(),name)
                  info=sftp.lstat(target)
                  if not stat.S_ISREG(info.st_mode) or info.st_size>1000000:
                      raise RuntimeError('STOP: not a regular bootstrap file or unexpected size')
                  with sftp.open(target,'rb') as handle:
                      remote=handle.read(1000001)
                  if len(remote)!=info.st_size:
                      raise RuntimeError('STOP: remote size changed during read')
          finally:
              client.close()
          print('path:', name)
          print('remote_bytes:', len(remote))
          print('github_bytes:', len(reference))
          print('remote_sha256:',hashlib.sha256(remote).hexdigest())
          print('github_sha256:',hashlib.sha256(reference).hexdigest())
          print('content_identical:',remote==reference)
          print('remote_contains_statistics_link:',b'admin/statistieken.php' in remote)
          print('github_contains_statistics_link:',b'admin/statistieken.php' in reference)
          print('No production write operations performed')
          PY
