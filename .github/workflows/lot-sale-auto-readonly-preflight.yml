name: Lot sale automatic read-only preflight after green main CI
on:
  workflow_run:
    workflows:
      - PHP syntax and repository checks
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-production-deploy
  cancel-in-progress: false
jobs:
  readonly:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
      OVH_SFTP_BASE: ${{ vars.OVH_SFTP_BASE }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: 'Checkout exact validated commit'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: 'Require current main commit and relevant release diff'
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" || { echo "Stale CI SHA; stop"; exit 1; }
          # Fail closed: missing history must never produce a successful skipped preflight.
          git cat-file -e 'HEAD^{commit}' || { echo "STOP: parent commit unavailable"; exit 1; }
          changed="$(git diff --name-only HEAD^ HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(private/lot_form[.]php|private/snapshots[.]php|catalogus-public/admin/kavel[.]php|[.]github/workflows/lot-sale-auto-readonly-preflight[.]yml)
      - uses: shivammathur/setup-php@v2
        if: steps.scope.outputs.relevant == 'true'
        with:
          php-version: '8.2'
          coverage: none
          tools: none
      - name: 'Offline lint, tests and exact three-file plan'
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          python3 tests/lot_sale_auto_preflight_history_test.py
          python3 -m py_compile scripts/deploy_lot_sale_three_simple.py
          python3 scripts/deploy_lot_sale_three_simple.py plan --release-sha "$RELEASE_SHA"
      - name: 'Read-only pinned OVH SFTP hash preflight'
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'paramiko==3.5.1'
          python3 scripts/deploy_lot_sale_three_simple.py preflight --release-sha "$RELEASE_SHA"
      - name: 'Archive read-only evidence'
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lot-sale-auto-readonly-${{ github.run_id }}
          path: lot-sale-three-preflight.json
          retention-days: 7
          if-no-files-found: error
; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant release changes; skip remote preflight."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: shivammathur/setup-php@v2
        if: steps.scope.outputs.relevant == 'true'
        with:
          php-version: '8.2'
          coverage: none
          tools: none
      - name: 'Offline lint, tests and exact three-file plan'
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy_lot_sale_three_simple.py
          python3 scripts/deploy_lot_sale_three_simple.py plan --release-sha "$RELEASE_SHA"
      - name: 'Read-only pinned OVH SFTP hash preflight'
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'paramiko==3.5.1'
          python3 scripts/deploy_lot_sale_three_simple.py preflight --release-sha "$RELEASE_SHA"
      - name: 'Archive read-only evidence'
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lot-sale-auto-readonly-${{ github.run_id }}
          path: lot-sale-three-preflight.json
          retention-days: 7
          if-no-files-found: error
