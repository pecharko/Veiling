name: Phase C combined preflight offline
on:
  pull_request:
    paths:
      - 'scripts/phase_c_combined_preflight.py'
      - 'tests/phase_c_combined_preflight_test.py'
      - '.github/workflows/phase-c-combined-preflight-tests.yml'
permissions:
  contents: read
jobs:
  offline-combined-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p phase_c_combined_preflight_test.py -v
